# /etc/nginx/sites-available/kaoyan.hi55555.cn
server {
    listen 80;
    listen [::]:80;
    server_name kaoyan.hi55555.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kaoyan.hi55555.cn;

    ssl_certificate     /etc/letsencrypt/live/kaoyan.hi55555.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaoyan.hi55555.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YantuSSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;
    server_tokens off;

    access_log /var/log/nginx/yantu.access.log;
    error_log  /var/log/nginx/yantu.error.log;

    # App-level login protects the study pages. Guests can only reach /match.
    location = /api/chat {
        proxy_buffering off;
        proxy_cache off;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location = /api/random/chat {
        proxy_buffering off;
        proxy_cache off;
        limit_req zone=yantu_api burst=5 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location = /api/tutor/chat {
        proxy_buffering off;
        proxy_cache off;
        limit_req zone=yantu_api burst=5 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location ^~ /api/auth/ {
        limit_req zone=yantu_auth burst=5 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location = /api/upload-tickets {
        limit_req zone=yantu_api burst=5 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location ^~ /api/m/upload/ {
        limit_req zone=yantu_upload burst=5 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location = /api/match/join {
        limit_req zone=yantu_match burst=3 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location ~ ^/api/(papers|grade|questions|skip|tutor) {
        limit_req zone=yantu_api burst=8 nodelay;
        include /etc/nginx/snippets/yantu-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/yantu-proxy.conf;
    }
}
