# /etc/nginx/conf.d/yantu-limits.conf
limit_req_zone $binary_remote_addr zone=yantu_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=yantu_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=yantu_match:10m rate=10r/m;

# QR upload tickets
limit_req_zone $binary_remote_addr zone=yantu_upload:10m rate=20r/m;
